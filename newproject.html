<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Kelas XII IPA 1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'DM Sans', sans-serif;
        }

        :root {
            --primary: #e8785d;
            --primary-dark: #c85d47;
            --ink: #233244;
            --muted: #6d7782;
            --surface: #fffdf9;
            --soft-surface: #edf2ed;
            --line: rgba(35, 50, 68, 0.12);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #fffaf4;
            color: var(--ink);
            line-height: 1.6;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 253, 249, 0.9);
            border-bottom: 1px solid var(--line);
            box-shadow: 0 8px 30px rgba(35, 50, 68, 0.06);
            backdrop-filter: blur(14px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 17px 6vw;
            z-index: 1000;
        }

        header .logo {
            color: var(--ink);
            font-family: 'Playfair Display', serif;
            font-size: 1.35rem;
            letter-spacing: 0.02em;
        }

        header .logo span {
            color: var(--primary);
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 28px;
        }

        nav ul li a {
            color: var(--ink);
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: var(--primary);
        }

        .menu-toggle {
            display: none;
            border: 0;
            background: transparent;
            color: var(--ink);
            cursor: pointer;
            font-size: 1.5rem;
            padding: 6px;
        }

        .hero {
            min-height: 100vh;
            padding: 120px 20px 80px;
            background: linear-gradient(135deg, rgba(35, 50, 68, 0.96), rgba(48, 72, 86, 0.88)), url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=1350&q=80') no-repeat center center / cover;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero h1 {
            max-width: 780px;
            margin-bottom: 18px;
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.8rem, 7vw, 5.8rem);
            line-height: 1.05;
            letter-spacing: -0.02em;
        }

        .hero p {
            margin-bottom: 20px;
            color: #f9e4d7;
            font-size: 1.1rem;
        }

        .btn {
            display: inline-block;
            padding: 13px 26px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            background: var(--primary);
            color: white;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 10px 24px rgba(232, 120, 93, 0.28);
            transition: background 0.3s ease, transform 0.3s ease;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-3px);
        }

        .container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 110px 30px;
        }

        section h2 {
            margin-bottom: 46px;
            color: var(--ink);
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 4vw, 3.2rem);
            text-align: center;
        }

        section[id] {
            scroll-margin-top: 90px;
        }

        .about-content {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 64px;
        }

        .about-text,
        .about-img {
            flex: 1;
            min-width: 300px;
        }

        .about-text p {
            margin-bottom: 15px;
            color: var(--muted);
            font-size: 1.03rem;
        }

        .about-img {
            text-align: center;
        }

        .about-img img,
        .gallery-item img {
            display: block;
            width: 100%;
        }

        .about-img img {
            border: 10px solid var(--surface);
            border-radius: 24px 24px 24px 4px;
            box-shadow: 0 18px 40px rgba(35, 50, 68, 0.14);
        }

        .struct-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .struct-card {
            padding: 28px 22px;
            border: 1px solid var(--line);
            border-radius: 18px 18px 18px 4px;
            background: var(--surface);
            box-shadow: 0 12px 28px rgba(35, 50, 68, 0.06);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .struct-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 34px rgba(35, 50, 68, 0.11);
        }

        .struct-card i {
            margin-bottom: 15px;
            color: var(--primary);
            font-size: 2.2rem;
        }

        .struct-card h3 {
            margin-bottom: 5px;
            color: var(--ink);
            font-size: 1.1rem;
        }

        .struct-card p {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .structure-section {
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            background: var(--soft-surface);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .gallery-item img {
            height: 240px;
            border-radius: 18px 18px 18px 4px;
            object-fit: cover;
            box-shadow: 0 12px 28px rgba(35, 50, 68, 0.12);
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .gallery-item img:hover {
            transform: translateY(-5px);
            filter: saturate(1.1);
        }

        a:focus-visible {
            outline: 3px solid #f6c945;
            outline-offset: 3px;
        }

        footer {
            margin-top: 0;
            padding: 28px 20px;
            background: var(--ink);
            color: #dce5e8;
            text-align: center;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            header {
                padding: 14px 20px;
                flex-wrap: wrap;
                gap: 8px;
            }

            .menu-toggle {
                display: block;
            }

            nav {
                display: none;
                flex-basis: 100%;
            }

            nav.is-open {
                display: block;
            }

            nav ul {
                display: grid;
                gap: 4px;
                padding: 8px 0 4px;
            }

            nav ul li {
                margin-left: 0;
            }

            .hero {
                padding-top: 140px;
            }

            .hero h1 {
                font-size: 2.2rem;
            }

            .hero p {
                font-size: 1rem;
            }

            .container {
                padding: 56px 20px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Kelas <span>XII IPA 1</span></div>
        <button class="menu-toggle" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="main-nav">
            <i class="fas fa-bars" aria-hidden="true"></i>
        </button>
        <nav id="main-nav" aria-label="Navigasi utama">
            <ul>
                <li><a href="newproject.html">Beranda</a></li>
                <li><a href="tentang.html">Tentang</a></li>
                <li><a href="struktur.html">Struktur</a></li>
                <li><a href="galeri.html">Daftar Kelas</a></li>
            </ul>
        </nav>
    </header>

    <section id="home" class="hero">
        <h1>Selamat Datang di Website Kelas Kami</h1>
        <p>Kompak, Solid, dan Bersama Menuju Sukses!</p>
        <a href="tentang.html" class="btn">Kenalan Yuk</a>
    </section>

    <footer>
        <p>&copy; 2026 Kelas XII IPA 1. Dibuat dengan hati oleh Kelas.</p>
    </footer>

    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const mainNav = document.querySelector('#main-nav');
        const navLinks = document.querySelectorAll('#main-nav a');

        function closeMenu() {
            mainNav.classList.remove('is-open');
            menuToggle.setAttribute('aria-expanded', 'false');
            menuToggle.setAttribute('aria-label', 'Buka menu');
            menuToggle.querySelector('i').className = 'fas fa-bars';
        }

        menuToggle.addEventListener('click', () => {
            const isOpen = mainNav.classList.toggle('is-open');
            menuToggle.setAttribute('aria-expanded', String(isOpen));
            menuToggle.setAttribute('aria-label', isOpen ? 'Tutup menu' : 'Buka menu');
            menuToggle.querySelector('i').className = isOpen ? 'fas fa-times' : 'fas fa-bars';
        });

        navLinks.forEach((link) => link.addEventListener('click', closeMenu));
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeMenu();
        });
    </script>
</body>
</html>
